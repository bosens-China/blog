[project]
name = "new-blog-monorepo"
version = "0.1.0"
description = "Monorepo for blog project"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/blog-core", "apps/blog-server"]

[tool.uv]
dev-dependencies = [
    "pyright>=1.1.345",
    "ruff>=0.1.9",
    "boto3-stubs[essential]>=1.34.0",
    "types-beautifulsoup4>=4.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"packages/blog-core/src/workflow/nodes/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["packages/blog-core/src", "apps/blog-server/src"]

reportMissingTypeStubs = false
reportUnknownParameterType = true
