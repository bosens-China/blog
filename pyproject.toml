[project]
name = "blog-core"
version = "0.1.0"
description = "Blog generation core logic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.60",
    "langchain>=0.3.14",
    "langchain-openai>=0.1.0",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "marko>=2.0.0",
    "beautifulsoup4>=4.12.3",
    "boto3>=1.34.0",
    "colorlog>=6.10.1",
]

[tool.uv]
dev-dependencies = [
    "pyright>=1.1.345",
    "ruff>=0.1.9",
    "boto3-stubs[essential]>=1.34.0",
    "types-beautifulsoup4>=4.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"packages/blog-core/src/workflow/nodes/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["packages/blog-core/src"]

reportMissingTypeStubs = false
reportUnknownParameterType = true
