name: Deploy Blog

on:
  push:
    branches:
      - 'new-blog@v1'
    paths:
      - '.github/workflows/deploy.yml'
      - 'apps/blog/**'
      - 'packages/blog-core/**'
      - 'packages/blog-data/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'pyproject.toml'
      - 'pylock.toml'
      - '.python-version'
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  # 跟随上游周一任务，分别在其主触发和兜底触发后延迟 15 分钟执行。
  # GitHub Actions cron 使用 UTC：00:03 / 00:33 UTC 分别对应北京时间周一 08:03 / 08:33。
  schedule:
    - cron: '3 0 * * 1'
    - cron: '33 0 * * 1'
  workflow_dispatch:

# 并发控制：同一组任务只允许一个运行，取消正在进行的旧任务
concurrency:
  group: deploy-blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Issue 事件只允许仓库所有者触发实际部署，避免公开仓库被外部 Issue 操作消耗密钥和资源。
    if: github.event_name != 'issues' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Python Types
        run: pnpm check

      - name: Check Python Lint
        run: pnpm lint

      # 所有触发方式都会重新生成前端依赖的 JSON 数据，结果随后提交回仓库，便于本地调试与复现。
      - name: Generate Data & Process Images
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_CORE_LLM_API_KEY: ${{ secrets.BLOG_CORE_LLM_API_KEY }}
          BLOG_CORE_LLM_API_BASE: ${{ vars.BLOG_CORE_LLM_API_BASE }}
          BLOG_CORE_LLM_API_MODEL: ${{ vars.BLOG_CORE_LLM_API_MODEL }}
          DOGECLOUD_ACCESS_KEY: ${{ secrets.DOGECLOUD_ACCESS_KEY }}
          DOGECLOUD_SECRET_KEY: ${{ secrets.DOGECLOUD_SECRET_KEY }}
          DOGECLOUD_IMAGE_BUCKET: ${{ vars.DOGECLOUD_IMAGE_BUCKET }}
          DOGECLOUD_IMAGE_DOMAIN: ${{ vars.DOGECLOUD_IMAGE_DOMAIN }}

      # push / 定时 / 手动：同步 GitHub 周刊并处理图床
      - name: Sync GitHub Weekly
        if: github.event_name != 'issues'
        run: pnpm sync:weekly
        env:
          DOGECLOUD_ACCESS_KEY: ${{ secrets.DOGECLOUD_ACCESS_KEY }}
          DOGECLOUD_SECRET_KEY: ${{ secrets.DOGECLOUD_SECRET_KEY }}
          DOGECLOUD_IMAGE_BUCKET: ${{ vars.DOGECLOUD_IMAGE_BUCKET }}
          DOGECLOUD_IMAGE_DOMAIN: ${{ vars.DOGECLOUD_IMAGE_DOMAIN }}

      - name: Check Astro Frontend
        run: pnpm --filter blog check
        env:
          DOGECLOUD_STATIC_DOMAIN: ${{ vars.DOGECLOUD_STATIC_DOMAIN }}
          PUBLIC_DOGECLOUD_IMAGE_DOMAIN: ${{ vars.DOGECLOUD_IMAGE_DOMAIN }}
          PUBLIC_BLOG_API_URL: ${{ vars.PUBLIC_BLOG_API_URL }}

      - name: Build Astro Frontend
        run: pnpm --filter blog build
        env:
          DOGECLOUD_STATIC_DOMAIN: ${{ vars.DOGECLOUD_STATIC_DOMAIN }}
          PUBLIC_DOGECLOUD_IMAGE_DOMAIN: ${{ vars.DOGECLOUD_IMAGE_DOMAIN }}
          PUBLIC_BLOG_API_URL: ${{ vars.PUBLIC_BLOG_API_URL }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain packages/blog-data)" ]; then
            echo "Changes detected in packages/blog-data"
            git add packages/blog-data
            git commit -m "chore: update blog data cache [skip ci]" --no-verify
            git pull --rebase
            git push
          else
            echo "No changes detected in packages/blog-data"
          fi

      - name: Deploy to Static Storage
        run: pnpm run deploy:static
        env:
          DOGECLOUD_STATIC_PROXY_POOL: 'true'
          DOGECLOUD_STATIC_PROXY_SOURCE: ${{ vars.DOGECLOUD_STATIC_PROXY_SOURCE }}
          DOGECLOUD_ACCESS_KEY: ${{ secrets.DOGECLOUD_ACCESS_KEY }}
          DOGECLOUD_SECRET_KEY: ${{ secrets.DOGECLOUD_SECRET_KEY }}
          DOGECLOUD_STATIC_BUCKET: ${{ vars.DOGECLOUD_STATIC_BUCKET }}
          DOGECLOUD_STATIC_DOMAIN: ${{ vars.DOGECLOUD_STATIC_DOMAIN }}
