name: Deploy Blog

on:
  push:
    branches:
      - 'new-blog@v1'
    paths:
      - '.github/workflows/deploy.yml'
      - 'apps/blog/**'
      - 'packages/blog-core/**'
      - 'packages/blog-data/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  # 北京时间每周一 09:00；GitHub Actions cron 使用 UTC，因此这里是周一 01:00 UTC。
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

# 并发控制：同一组任务只允许一个运行，取消正在进行的旧任务
concurrency:
  group: deploy-blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Issue 事件只允许仓库所有者触发实际部署，避免公开仓库被外部 Issue 操作消耗密钥和资源。
    if: github.event_name != 'issues' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.8.3'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            packages/*/pyproject.toml
            apps/*/pyproject.toml

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          uv sync --frozen --all-packages
          pnpm install --frozen-lockfile

      - name: Check Python Types
        run: uv run pyright

      - name: Check Python Lint
        run: uv run ruff check .

      # push / issues / 手动：同步 GitHub Issues 文章并处理图床
      - name: Generate Data & Process Images
        if: github.event_name != 'schedule'
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DOGECLOUD_ACCESS_KEY: ${{ secrets.DOGECLOUD_ACCESS_KEY }}
          DOGECLOUD_SECRET_KEY: ${{ secrets.DOGECLOUD_SECRET_KEY }}
          DOGECLOUD_BUCKET: ${{ secrets.DOGECLOUD_BUCKET }}
          DOGECLOUD_DOMAIN: ${{ secrets.DOGECLOUD_DOMAIN }}

      # push / 定时 / 手动：同步 GitHub 周刊并处理图床
      - name: Sync GitHub Weekly
        if: github.event_name != 'issues'
        run: uv run packages/blog-core/src/scripts/sync_weekly.py
        env:
          DOGECLOUD_ACCESS_KEY: ${{ secrets.DOGECLOUD_ACCESS_KEY }}
          DOGECLOUD_SECRET_KEY: ${{ secrets.DOGECLOUD_SECRET_KEY }}
          DOGECLOUD_BUCKET: ${{ secrets.DOGECLOUD_BUCKET }}
          DOGECLOUD_DOMAIN: ${{ secrets.DOGECLOUD_DOMAIN }}

      - name: Check Astro Frontend
        run: pnpm --filter blog check
        env:
          DOGECLOUD_STATIC_DOMAIN: ${{ secrets.DOGECLOUD_STATIC_DOMAIN }}
          PUBLIC_DOGECLOUD_DOMAIN: ${{ secrets.DOGECLOUD_DOMAIN }}
          PUBLIC_ASK_AI_API: ${{ secrets.PUBLIC_ASK_AI_API }}

      - name: Build Astro Frontend
        run: pnpm --filter blog build
        env:
          DOGECLOUD_STATIC_DOMAIN: ${{ secrets.DOGECLOUD_STATIC_DOMAIN }}
          PUBLIC_DOGECLOUD_DOMAIN: ${{ secrets.DOGECLOUD_DOMAIN }}
          PUBLIC_ASK_AI_API: ${{ secrets.PUBLIC_ASK_AI_API }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain packages/blog-data)" ]; then
            echo "Changes detected in packages/blog-data"
            git add packages/blog-data
            git commit -m "chore: update blog data cache [skip ci]" --no-verify
            git pull --rebase
            git push
          else
            echo "No changes detected in packages/blog-data"
          fi

      - name: Deploy to Static Storage
        run: pnpm run deploy:static
        env:
          DOGECLOUD_ACCESS_KEY: ${{ secrets.DOGECLOUD_ACCESS_KEY }}
          DOGECLOUD_SECRET_KEY: ${{ secrets.DOGECLOUD_SECRET_KEY }}
          DOGECLOUD_STATIC_BUCKET: ${{ secrets.DOGECLOUD_STATIC_BUCKET }}
          DOGECLOUD_STATIC_DOMAIN: ${{ secrets.DOGECLOUD_STATIC_DOMAIN }}
