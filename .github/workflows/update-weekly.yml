name: Update GitHub Weekly

on:
  # 北京时间每周一 09:00；GitHub Actions cron 使用 UTC，因此这里是周一 01:00 UTC。
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

concurrency:
  group: update-github-weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.8.3'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            packages/*/pyproject.toml
            apps/*/pyproject.toml

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          uv sync --frozen --all-packages
          pnpm install --frozen-lockfile

      - name: Check Python Types
        run: uv run pyright

      - name: Check Python Lint
        run: uv run ruff check .

      - name: Sync GitHub Weekly
        run: uv run packages/blog-core/src/scripts/sync_weekly.py
        env:
          DOGECLOUD_ACCESS_KEY: ${{ secrets.DOGECLOUD_ACCESS_KEY }}
          DOGECLOUD_SECRET_KEY: ${{ secrets.DOGECLOUD_SECRET_KEY }}
          DOGECLOUD_BUCKET: ${{ secrets.DOGECLOUD_BUCKET }}
          DOGECLOUD_DOMAIN: ${{ secrets.DOGECLOUD_DOMAIN }}

      - name: Check Astro Frontend
        run: pnpm --filter blog check
        env:
          DOGECLOUD_STATIC_DOMAIN: ${{ secrets.DOGECLOUD_STATIC_DOMAIN }}
          PUBLIC_DOGECLOUD_DOMAIN: ${{ secrets.DOGECLOUD_DOMAIN }}
          PUBLIC_ASK_AI_API: ${{ secrets.PUBLIC_ASK_AI_API }}

      - name: Build Astro Frontend
        run: pnpm --filter blog build
        env:
          DOGECLOUD_STATIC_DOMAIN: ${{ secrets.DOGECLOUD_STATIC_DOMAIN }}
          PUBLIC_DOGECLOUD_DOMAIN: ${{ secrets.DOGECLOUD_DOMAIN }}
          PUBLIC_ASK_AI_API: ${{ secrets.PUBLIC_ASK_AI_API }}

      - name: Commit and Push Weekly Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain packages/blog-data)" ]; then
            echo "Weekly data changes detected"
            git add packages/blog-data
            git commit -m "chore: update github weekly data [skip ci]" --no-verify
            git pull --rebase
            git push
          else
            echo "No weekly data changes detected"
          fi

      - name: Deploy to Static Storage
        run: pnpm run deploy:static
        env:
          DOGECLOUD_ACCESS_KEY: ${{ secrets.DOGECLOUD_ACCESS_KEY }}
          DOGECLOUD_SECRET_KEY: ${{ secrets.DOGECLOUD_SECRET_KEY }}
          DOGECLOUD_STATIC_BUCKET: ${{ secrets.DOGECLOUD_STATIC_BUCKET }}
          DOGECLOUD_STATIC_DOMAIN: ${{ secrets.DOGECLOUD_STATIC_DOMAIN }}
