name: Publish Blog Server Image

on:
  push:
    branches:
      - 'new-blog@v1'
    paths:
      - '.github/workflows/docker-publish.yml'
      - '.dockerignore'
      - 'apps/blog-server/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

concurrency:
  group: publish-blog-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/blog-server/Dockerfile
          # Dockerfile 使用 Python 3.12.x patch 版本并固定 digest，避免被误读为 Python 3.13 或被上游 tag 漂移影响。
          push: true
          tags: |
            boses/ask-ai:latest
            boses/ask-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
